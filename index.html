<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  // Completar con los datos del proyecto Supabase (Settings > API)
  window.OB_CONFIG = {
    supabaseUrl: 'https://TU-PROYECTO.supabase.co',
    supabaseAnonKey: 'TU-ANON-KEY'
  };
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?external=react",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
:root{
  --hormigon:#E7E8E3; --papel:#F6F6F2; --tinta:#1E2A30; --tinta2:#51616A; --linea:#C9CCC4;
  --agua:#2B6A8A; --agua-suave:#DCE8EE; --senal:#E3A91B; --senal-suave:#FBF0D2;
  --rojo:#B23A26; --rojo-suave:#F5DDD7; --verde:#3F7A4A; --verde-suave:#DDEBDF;
  --r:4px;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--tinta);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--hormigon)}
body{font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.nav{background:var(--tinta);color:#DDE3E5;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.nav .marca{padding:0 18px 18px;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;color:#fff;line-height:1.1}
.nav .marca small{display:block;font-family:'Barlow',sans-serif;font-size:12px;font-weight:400;color:#9FB0B7;margin-top:4px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:9px 18px 9px 14px;cursor:pointer;color:inherit}
.nav button:hover{background:#2A3A42}
.nav button.act{border-left-color:var(--senal);background:#2A3A42;color:#fff;font-weight:600}
.nav .pie{padding:18px;font-size:12px;color:#9FB0B7}
.nav .pie button{padding:6px 0;border:0;color:#DDE3E5;text-decoration:underline}
.main{padding:24px 28px 60px;min-width:0}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cab p{margin:4px 0 0;color:var(--tinta2)}
.acciones{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--tinta);background:var(--tinta);color:#fff;padding:7px 14px;border-radius:var(--r);cursor:pointer;font-weight:500}
.btn:hover{background:#31434B}
.btn.sec{background:transparent;color:var(--tinta)}
.btn.sec:hover{background:var(--papel)}
.btn.peligro{background:var(--rojo);border-color:var(--rojo)}
.btn.chico{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--agua);cursor:pointer;padding:0;text-decoration:underline}

/* franja de indicadores: la planilla de obra */
.franja{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--papel);border:1px solid var(--linea);border-top:6px solid var(--tinta);margin-bottom:22px}
.franja>div{padding:14px 16px;border-right:1px solid var(--linea)}
.franja>div:last-child{border-right:0}
.franja .q{font-size:13px;color:var(--tinta2)}
.franja .v{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.franja .d{font-size:12px;color:var(--tinta2)}
.franja .clave{background:var(--senal-suave)}
.franja .clave .v{font-size:31px}

.bloque{background:var(--papel);border:1px solid var(--linea);margin-bottom:22px}
.bloque>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linea)}
.bloque>.cuerpo{padding:14px 16px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:22px}
.scroll{overflow-x:auto}

table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;text-align:left;color:var(--tinta2);padding:8px 10px;border-bottom:2px solid var(--linea);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #DFE1DA;vertical-align:top}
tr.clic{cursor:pointer} tr.clic:hover td{background:#EEEFEA}
tr.sel td{background:var(--senal-suave)}
tr.anul td{color:#98A2A6;text-decoration:line-through}
tfoot td{font-weight:600;border-top:2px solid var(--linea);border-bottom:0}
.der{text-align:right;white-space:nowrap}
.neg{color:var(--rojo)} .pos{color:var(--verde)}
.sub{display:block;font-size:12px;color:var(--tinta2)}
.vacio{padding:26px 16px;color:var(--tinta2)}

.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--verde-suave);color:var(--verde)}
.chip.pend{background:var(--senal-suave);color:#8A6300}
.chip.mal{background:var(--rojo-suave);color:var(--rojo)}
.chip.neu{background:#E4E7E2;color:var(--tinta2)}
.chip.info{background:var(--agua-suave);color:var(--agua)}

.filtros{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--linea)}
.filtros input,.filtros select{padding:6px 8px;border:1px solid var(--linea);border-radius:var(--r);background:#fff}

.alertas{list-style:none;margin:0;padding:0}
.alertas li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #DFE1DA}
.alertas li:last-child{border-bottom:0}
.alertas .m{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.alertas .alta{background:var(--rojo)} .alertas .media{background:var(--senal)} .alertas .baja{background:var(--agua)}

/* formularios */
.velo{position:fixed;inset:0;background:rgba(30,42,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20}
.modal{background:var(--papel);width:100%;max-width:640px;border-top:6px solid var(--tinta);box-shadow:0 18px 50px rgba(20,30,35,.3)}
.modal.ancho{max-width:900px}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--linea)}
.modal>.cuerpo{padding:16px 18px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--linea)}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--tinta2)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo.full{grid-column:1/-1}
.campo label{font-size:13px;font-weight:600}
.campo label i{color:var(--rojo);font-style:normal}
.campo input,.campo select,.campo textarea{padding:8px 9px;border:1px solid var(--linea);border-radius:var(--r);background:#fff;width:100%}
.campo .ay{font-size:12px;color:var(--tinta2)}
.campo.check{flex-direction:row;align-items:center;gap:8px}
.campo.check input{width:auto}
.error{background:var(--rojo-suave);color:var(--rojo);padding:9px 12px;border-radius:var(--r);margin-bottom:12px;font-weight:500}
.aviso{background:var(--senal-suave);color:#6E5000;padding:9px 12px;border-radius:var(--r);margin-bottom:12px}

/* cascada de liquidación */
.cascada{width:100%;font-size:15px}
.cascada td{border-bottom:1px dashed #D5D8D0;padding:7px 8px}
.cascada td:first-child{width:28px;color:var(--tinta2);text-align:center}
.cascada tr.tot td{border-bottom:2px solid var(--tinta);font-weight:600;font-family:'Barlow Condensed',sans-serif;font-size:19px}
.cascada tr.fin td{background:var(--senal-suave);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:23px;border-bottom:0}
.cascada input{width:150px;padding:5px 7px;border:1px solid var(--linea);border-radius:var(--r);text-align:right;background:#fff}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--linea);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button.act{border-bottom-color:var(--senal);font-weight:600}

.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:40;max-width:420px}
.toast.err{background:var(--rojo)}
.login{max-width:380px;margin:12vh auto;background:var(--papel);border:1px solid var(--linea);border-top:6px solid var(--tinta);padding:24px}
.login .campo{margin-bottom:12px}
.cargando{padding:40px;color:var(--tinta2)}

@media (max-width:1100px){.franja{grid-template-columns:repeat(3,1fr)}.franja>div:nth-child(3){border-right:0}.franja>div:nth-child(-n+3){border-bottom:1px solid var(--linea)}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;height:auto;display:flex;align-items:center;overflow-x:auto;padding:0;z-index:10}
  .nav .marca{padding:10px 14px;font-size:17px;white-space:nowrap}.nav .marca small{display:none}
  .nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 12px;width:auto}
  .nav button.act{border-bottom-color:var(--senal)}
  .nav .pie{display:none}
  .main{padding:16px 12px 50px}
  .franja{grid-template-columns:1fr 1fr}.franja>div{border-right:0!important;border-bottom:1px solid var(--linea)}
  .campos{grid-template-columns:1fr}
  .velo{padding:0}.modal{min-height:100%}
}
@media print{.nav,.acciones,.btn,.filtros{display:none!important}.app{display:block}body,.bloque,.franja{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="cargando">Cargando…</div></div>
<script type="text/babel" data-type="module" data-presets="react" src="App.js"></script>
</body>
</html>
